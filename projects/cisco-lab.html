  <!-- Custom Animation Styles -->
  <style>
    /* Base hidden state */
    .scroll-anim {
      opacity: 0;
      will-change: transform, opacity;
      transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Bi-directional Keyframe Definitions */
    .scroll-anim[data-anim="fade-right"] { transform: translateX(-40px); }
    .scroll-anim[data-anim="fade-right"].is-visible { transform: translateX(0); opacity: 1; }

    .scroll-anim[data-anim="fade-left"] { transform: translateX(40px); }
    .scroll-anim[data-anim="fade-left"].is-visible { transform: translateX(0); opacity: 1; }

    .scroll-anim[data-anim="fade-down"] { transform: translateY(-40px); }
    .scroll-anim[data-anim="fade-down"].is-visible { transform: translateY(0); opacity: 1; }

    .scroll-anim[data-anim="fade-up"] { transform: translateY(40px); }
    .scroll-anim[data-anim="fade-up"].is-visible { transform: translateY(0); opacity: 1; }

    .scroll-anim[data-anim="middle-in"] { transform: scale(1.15); }
    .scroll-anim[data-anim="middle-in"].is-visible { transform: scale(1); opacity: 1; }

    .scroll-anim[data-anim="middle-out"] { transform: scale(0.85); }
